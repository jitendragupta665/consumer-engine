<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consumer Engine</title>
<style>body{font:16px system-ui;max-width:960px;margin:35px auto;padding:0 16px;background:#f5f7fa;color:#152238}section{background:white;padding:22px;border-radius:12px;margin:20px 0}input,select,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}button{background:#155eef;color:white}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}</style>
<h1>Consumer Engine</h1><p>Evidence-backed B2C problem discovery. Scores are heuristics, not success probabilities.</p>
<section><h2>Problems</h2><input id="query" placeholder="Search findings"><select id="filter"><option value="">All sectors</option></select><div style="overflow:auto"><table><thead><tr><th>Problem</th><th>Sector</th><th>Country</th><th>Score</th><th>Evidence</th></tr></thead><tbody id="results"></tbody></table></div></section>
<section><h2>Add evidence</h2><form id="form"><select name="sector" id="sector"></select><input name="category" placeholder="Category"><input name="subcategory" placeholder="Subcategory"><input name="title" placeholder="Problem title" required><input name="description" placeholder="Description"><input name="country" placeholder="Country"><input name="source" type="url" placeholder="Evidence URL" required><p>Rate each 1–5:</p><div id="ratings"></div><button>Save</button></form><p id="status"></p></section>
<script>
const $=id=>document.getElementById(id);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const name of ['reach','severity','feasibility','retention','payment'])$('ratings').insertAdjacentHTML('beforeend', '<label>'+name+' <input name="'+name+'" type="number" min="1" max="5" value="3" style="width:50px"></label>');
async function refresh(){const records=await(await fetch('/api/problems')).json(),q=$('query').value.toLowerCase(),f=$('filter').value;$('results').innerHTML=records.filter(r=>(!f||r.sector===f)&&JSON.stringify(r).toLowerCase().includes(q)).map(r=>'<tr><td><b>'+escape(r.title)+'</b><p>'+escape(r.description)+'</p></td><td>'+escape(r.sector)+' / '+escape(r.category)+'</td><td>'+escape(r.country)+'</td><td>'+r.score+'</td><td><a target="_blank" rel="noopener noreferrer" href="'+escape(r.source)+'">Source</a></td></tr>').join('')}
(async()=>{const sectors=await(await fetch('/api/sectors')).json();for(const s of sectors)for(const id of ['sector','filter']){const o=document.createElement('option');o.value=o.textContent=s;$(id).append(o)}await refresh()})();
$('query').oninput=refresh;$('filter').onchange=refresh;
$('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/problems',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('status').textContent=r.ok?'Saved successfully':JSON.stringify(await r.json());if(r.ok)refresh()};
</script></html>
